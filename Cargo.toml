[package]
name = "meerkat"
version = "0.1.0"
edition = "2024"
description = "Compact widget that watches the sync state of local git repositories"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
